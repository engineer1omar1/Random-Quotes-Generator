<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quotes Generator</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h1>Random Quotes Generator</h1>
    <div class="quotes">
        <div class="quotes-number">0</div>
        <div class="quote-display">The successful warrior is the average man, with laser-like focus.</div>
        <div class="wonerquote">Bruce Lee</div>
        <div class="buttons">
            <button class="generate">Generate Quotes</button>
            <button class="auto">Auto Generate</button>
            <button class="stop">Stop Quotes</button>
        </div>
    </div>
    <div class="auto-status"></div>
    <script src="main.js"></script>
</body>
</html>
